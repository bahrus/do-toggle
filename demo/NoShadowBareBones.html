<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Shadow Bare Bones</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-grouped-capture-statements.js" 
                parser-name=parse-grouped-capture-statements></script>
        <script type=emc 
                src="do-toggle/emc.json" 
                wait-for-parsers=parse-grouped-capture-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
        class MoodStone extends HTMLElement {
            #isHappy = false;
            get isHappy(){
                return this.#isHappy;
            }
            set isHappy(nv){
                this.#isHappy = nv;
                this.querySelector('[itemprop="isHappy"]').textContent = '' + nv;
            }
        }
    </script>
</head>
<body>
    <mood-stone itemscope>
        <div>
            <span itemprop=isHappy></span>
        </div>
        <button do-toggle=isHappy>Toggle</button>
    </mood-stone>
    
</body>
</html>
