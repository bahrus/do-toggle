<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All do-toggle Examples</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="do-toggle/⏻.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
        import 'xtal-element/index.js';
        
        class MoodStone extends HTMLElement{
            connectedCallback(){
                this.isHappy = true;
            }
        }
        customElements.define('mood-stone', MoodStone);
        
        class LightSwitch extends HTMLElement{
            connectedCallback(){
                this.isOn = false;
            }
        }
        customElements.define('light-switch', LightSwitch);
    </script>
    <style>
        section {
            border: 2px solid #ccc;
            margin: 20px;
            padding: 20px;
            border-radius: 8px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .display {
            font-size: 24px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>do-toggle (⏻) - All Examples</h1>
    
    <section>
        <h2>Example 1a - Basic Toggle</h2>
        <mood-stone itemscope>
            <div class="display">
                Is Happy: <span id=display1></span>
            </div>
            <button ⏻=isHappy>Toggle Mood</button>
            <script>
                {
                    const moodStone = document.currentScript.closest('mood-stone');
                    const display = document.getElementById('display1');
                    function updateDisplay(){
                        display.textContent = moodStone.isHappy ? '😊' : '😢';
                    }
                    updateDisplay();
                    setInterval(updateDisplay, 100);
                }
            </script>
        </mood-stone>
    </section>
    
    <section>
        <h2>Example 1a Infer - Infer from name attribute</h2>
        <mood-stone itemscope>
            <div class="display">
                Is Happy: <span id=display2></span>
            </div>
            <button disabled name=isHappy ⏻>Toggle Mood</button>
            <script>
                {
                    const moodStone = document.currentScript.closest('mood-stone');
                    const display = document.getElementById('display2');
                    function updateDisplay(){
                        display.textContent = moodStone.isHappy ? '😊' : '😢';
                    }
                    updateDisplay();
                    setInterval(updateDisplay, 100);
                }
            </script>
        </mood-stone>
    </section>
    
    <section>
        <h2>Example 1b - Specify Event Type</h2>
        <mood-stone itemscope>
            <div class="display">
                Is Happy: <span id=display3></span>
            </div>
            <button ⏻="isHappy on mouseover">Hover to Toggle Mood</button>
            <script>
                {
                    const moodStone = document.currentScript.closest('mood-stone');
                    const display = document.getElementById('display3');
                    function updateDisplay(){
                        display.textContent = moodStone.isHappy ? '😊' : '😢';
                    }
                    updateDisplay();
                    setInterval(updateDisplay, 100);
                }
            </script>
        </mood-stone>
    </section>
    
    <section>
        <h2>Example 1c - Toggle Peer Element</h2>
        <div itemscope>
            <light-switch id=myLight></light-switch>
            <div class="display">
                Light Status: <span id=display4></span>
            </div>
            <button ⏻="[#myLight].isOn">Toggle Light</button>
            <script>
                {
                    const lightSwitch = document.getElementById('myLight');
                    const display = document.getElementById('display4');
                    function updateDisplay(){
                        display.textContent = lightSwitch.isOn ? '💡 ON' : '⚫ OFF';
                    }
                    updateDisplay();
                    setInterval(updateDisplay, 100);
                }
            </script>
        </div>
    </section>
    
    <section>
        <h2>Example 1d - Toggle Checkbox</h2>
        <div itemscope>
            <label>
                <input type="checkbox" id=agreeCheckbox>
                I agree to the terms
            </label>
            <br><br>
            <button ⏻="[#agreeCheckbox]">Toggle Agreement</button>
        </div>
    </section>
    
    <section>
        <h2>Example 1e - With xtal-element</h2>
        <mood-stone itemscope>
            <div class="display">
                <span itemprop=isHappy></span>
            </div>
            <button ⏻=isHappy>Toggle Mood</button>
            <xtal-element
                prop-defaults='{
                    "isHappy": true
                }'
                xform='{
                    "| isHappy": 0
                }'
            ></xtal-element>
        </mood-stone>
    </section>
</body>
</html>
