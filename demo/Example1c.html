<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1c - Toggle Peer Element</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="do-toggle/⏻.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
        class LightSwitch extends HTMLElement{
            connectedCallback(){
                this.isOn = false;
            }
        }
        customElements.define('light-switch', LightSwitch);
    </script>
</head>
<body>
    <div itemscope>
        <light-switch id=myLight></light-switch>
        <div>
            Light Status: <span id=display></span>
        </div>
        <button ⏻="[#myLight].isOn">Toggle Light</button>
        <script>
            const lightSwitch = document.getElementById('myLight');
            const display = document.getElementById('display');
            function updateDisplay(){
                display.textContent = lightSwitch.isOn ? '💡 ON' : '⚫ OFF';
            }
            updateDisplay();
            // Watch for changes
            setInterval(updateDisplay, 100);
        </script>
    </div>
</body>
</html>
