<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1d - Toggle Checkbox</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="do-toggle/⏻.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <div itemscope>
        <label>
            <input type="checkbox" id=agreeCheckbox>
            I agree to the terms
        </label>
        <br><br>
        <button ⏻="#agreeCheckbox">Toggle Agreement</button>
    </div>
</body>
</html>
