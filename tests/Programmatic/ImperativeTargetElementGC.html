<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic imperative targetElement</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <mood-stone itemscope>
        <div>
            Is happy: <span itemprop=isHappy></span>
        </div>
        <light-switch id=kitchen></light-switch>
        <light-switch id=porch></light-switch>
        <button id=button>Toggle</button>
    </mood-stone>
    <div id=target></div>
    <script type=module>
        customElements.define('mood-stone', class extends HTMLElement {
            #isHappy = false;
            get isHappy(){ return this.#isHappy; }
            set isHappy(nv){
                this.#isHappy = nv;
                this.querySelector('[itemprop="isHappy"]').textContent = nv;
            }
        });
        customElements.define('light-switch', class extends HTMLElement {
            #isOn = false;
            get isOn(){ return this.#isOn; }
            set isOn(nv){
                this.#isOn = nv;
                this.textContent = nv ? '💡 ON' : 'OFF';
            }
        });
    </script>
    <script type=module>
        import {defDoToggle} from '/def.js';
        const emc = await defDoToggle(document.body);
        // Set up inside a function scope, so this page keeps no reference of its own
        // to the kitchen light -- only the DOM (until the test removes it) and do-toggle.
        (() => {
            button.enh.get(emc).toggles = [
                {prop: 'isOn', targetElement: document.querySelector('#kitchen')},
                {prop: 'isOn', targetElement: new WeakRef(document.querySelector('#porch'))},
            ];
        })();
    </script>
</body>
</html>
