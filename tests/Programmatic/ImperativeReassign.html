<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic imperative reassign</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <mood-stone itemscope>
        <div>
            Is happy: <span itemprop=isHappy></span>
        </div>
        <light-switch id=myLight></light-switch>
        <button id=button>Toggle</button>
    </mood-stone>
    <div id=target></div>
    <script type=module>
        customElements.define('mood-stone', class extends HTMLElement {
            #isHappy = false;
            get isHappy(){ return this.#isHappy; }
            set isHappy(nv){
                this.#isHappy = nv;
                this.querySelector('[itemprop="isHappy"]').textContent = nv;
            }
        });
        customElements.define('light-switch', class extends HTMLElement {
            #isOn = false;
            get isOn(){ return this.#isOn; }
            set isOn(nv){
                this.#isOn = nv;
                this.textContent = nv ? '💡 ON' : 'OFF';
            }
        });
    </script>
    <script type=module>
        import {defDoToggle} from '/def.js';
        const emc = await defDoToggle(document.body);
        const doToggle = button.enh.get(emc);
        doToggle.toggles = 'isHappy';
        // e.g. a framework re-rendering with new props:  this replaces the
        // click listener above rather than adding a second one.
        setTimeout(() => {
            doToggle.toggles = {prop: 'isOn', targetElementId: 'myLight'};
        }, 500);

        setTimeout(() => {
            button.click();
            setTimeout(() => {
                const ms = document.querySelector('mood-stone');
                const ls = document.querySelector('light-switch');
                if(ls.isOn === true && ms.isHappy === false) target.setAttribute('mark', 'good');
            }, 300);
        }, 1500);
    </script>
</body>
</html>
